name: Release macOS app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version and signing key
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure SPARKLE_PRIVATE_KEY before releasing.'; exit 1; }
      - name: Test
        run: |
          go test ./...
          go vet ./...
      - name: Build universal app
        run: ./desktop/build.sh
      - name: Package and sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          KEY_FILE="$RUNNER_TEMP/nats-desk-sparkle-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SPARKLE_KEY_FILE="$KEY_FILE" ./desktop/release.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Do not replace an existing release or move the update feed backwards.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Use a new version tag.'; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          new = tuple(map(int, Path('VERSION').read_text().strip().split('.')))
          for release in json.loads(Path(os.environ['RUNNER_TEMP'], 'releases.json').read_text()):
              if release['draft'] or release['prerelease']:
                  continue
              old = tuple(map(int, release['tag_name'].removeprefix('v').split('.')))
              assert new > old, 'Release version must increase'
          PY
          gh release create "$RELEASE_TAG" dist/release/*.dmg dist/release/*.sha256 dist/release/appcast.xml \
            --verify-tag --draft --title "NATS Desk $RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
